<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mystery Word Challenge</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:linear-gradient(135deg,#b9efff,#fff4bd);color:#14315c;min-height:100vh;padding:20px}main{max-width:1000px;margin:auto;background:white;border-radius:28px;padding:clamp(16px,3vw,36px);text-align:center;box-shadow:0 12px 35px #174e7522}h1{font-size:clamp(28px,5vw,52px);margin:0;color:#124ba0}p{font-size:clamp(18px,2.5vw,26px)}header{display:flex;justify-content:space-between;font-weight:bold;font-size:20px;margin:20px 0}progress{width:100%;height:18px;accent-color:#17a66a}.tiles{display:flex;justify-content:center;gap:clamp(5px,1vw,14px);margin:24px 0}button{font:inherit;font-weight:bold;cursor:pointer;border:0;border-radius:14px;padding:14px 22px;background:#1269c7;color:white;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}.tile,.slot{width:clamp(34px,10vw,100px);height:clamp(52px,11vw,100px);padding:0;font-size:clamp(25px,5vw,55px);display:grid;place-items:center}.tile{box-shadow:0 5px #08498d}.slot{background:#f0f7ff;border:3px dashed #9bbce2;color:#14315c}.actions{display:flex;justify-content:center;flex-wrap:wrap;gap:12px}.green{background:#13834f}.orange{background:#c56a08}.muted{background:#53677e}#feedback{min-height:40px;font-weight:bold}button:focus-visible{outline:4px solid #f3b900;outline-offset:3px}footer{margin-top:24px;color:#526680;font-size:14px}</style><main><h1>🐾 Mystery Word Challenge</h1><p>Unscramble the letters!</p><header><span id="count"></span><span id="score"></span></header><progress id="progress" max="8" value="0"></progress><div id="letters" class="tiles"></div><p>Your answer</p><div id="answer" class="tiles"></div><p id="feedback" role="status" aria-live="polite"></p><div class="actions"><button id="clear" class="muted">Clear</button><button id="check" class="green">Check Answer</button><button id="next" class="orange" hidden>Next Question →</button><button id="restart" class="muted">Restart Game</button></div><footer>PKGSD–MBI • Pertemuan 9 • My Pet • Activity 1</footer></main><script>
const data=[['EEGRN','GREEN'],['RBONW','BROWN'],['BITRAB','RABBIT'],['ETURTL','TURTLE'],['WLOLYE','YELLOW'],['SFHI','FISH'],['HIEWT','WHITE'],['ENROGA','ORANGE']];let i=0,picked=[],score=0,correct=false,message='';const $=id=>document.getElementById(id);function render(){const [letters,word]=data[i];$('count').textContent=`Question ${i+1} of 8`;$('score').textContent=`Score: ${score}/80`;$('progress').value=score/10;$('letters').replaceChildren();$('answer').replaceChildren();[...letters].forEach((l,j)=>{let b=document.createElement('button');b.className='tile';b.textContent=picked.includes(j)?'':l;b.disabled=correct||picked.includes(j);b.setAttribute('aria-label',l);b.onclick=()=>{picked.push(j);message='';render()};$('letters').append(b)});[...word].forEach((_,j)=>{let b=document.createElement('button');b.className='slot';b.textContent=picked[j]===undefined?'_':letters[picked[j]];b.disabled=correct||picked[j]===undefined;b.setAttribute('aria-label',`Answer position ${j+1}`);b.onclick=()=>{picked.splice(j,1);message='';render()};$('answer').append(b)});$('feedback').textContent=message;$('feedback').style.color=correct?'#13834f':'#b44420';$('check').disabled=correct||picked.length!==word.length;$('clear').disabled=correct||!picked.length;$('next').hidden=!correct||i===7;}$('clear').onclick=()=>{picked=[];message='';render()};$('check').onclick=()=>{if(correct)return;if(picked.map(j=>data[i][0][j]).join('')===data[i][1]){correct=true;score+=10;message=i===7?'🎉 Great job! You scored 80/80!':'Excellent! That’s correct!'}else message='Try again! You can do it!';render()};$('next').onclick=()=>{if(correct&&i<7){i++;picked=[];correct=false;message='';render()}};$('restart').onclick=()=>{i=0;picked=[];score=0;correct=false;message='';render()};render();</script></html>
